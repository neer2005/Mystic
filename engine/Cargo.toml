[package]
name = "mystic-ffi"
description = "C ABI over Nightjar's streaming engine for Mystic"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.82"
publish = false

[lib]
name = "mystic_ffi"
# staticlib for the Swift app; rlib so the ABI can be exercised by Rust tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pinned engine revision. Bump deliberately and re-run the ABI tests.
# The pin is Mystic's fork (branch mac-service-type-4.8.0): upstream e21b182 plus one commit that marks
# the stream sockets on macOS, where upstream leaves them unmarked (IP_TOS / IPV6_TCLASS, and
# SO_NET_SERVICE_TYPE for interactive voice and video). Moving the pin means rebasing that commit.
nightjar-core = { git = "https://github.com/neer2005/nightjar", rev = "866386b912dddf0f4e9086c93aab5be7fb2899c1", package = "nightjar-core" }
rubylight-protocol = { git = "https://github.com/neer2005/nightjar", rev = "866386b912dddf0f4e9086c93aab5be7fb2899c1", package = "rubylight-protocol" }
nightjar-policy = { git = "https://github.com/neer2005/nightjar", rev = "866386b912dddf0f4e9086c93aab5be7fb2899c1", package = "nightjar-policy" }

serde_json = "1"
opus = "=0.4.0"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
lto = true
codegen-units = 1
# Matches the engine workspace: a panic aborts like a C assert, so no unwinding
# ever crosses the C boundary.
panic = "abort"

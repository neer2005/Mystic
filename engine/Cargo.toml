[package]
name = "mystic-ffi"
description = "C ABI over Nightjar's streaming engine for Mystic"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.82"
publish = false

[lib]
name = "mystic_ffi"
# staticlib for the Swift app; rlib so the ABI can be exercised by Rust tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pinned engine revision. Bump deliberately and re-run the ABI tests.
nightjar-core = { git = "https://github.com/RamazanKara/nightjar", rev = "f25e40b6ebacb7ab0d7fcea5f55f63006670df58", package = "nightjar-core" }
rubylight-protocol = { git = "https://github.com/RamazanKara/nightjar", rev = "f25e40b6ebacb7ab0d7fcea5f55f63006670df58", package = "rubylight-protocol" }
nightjar-policy = { git = "https://github.com/RamazanKara/nightjar", rev = "f25e40b6ebacb7ab0d7fcea5f55f63006670df58", package = "nightjar-policy" }

serde_json = "1"
opus = "=0.4.0"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
lto = true
codegen-units = 1
# Matches the engine workspace: a panic aborts like a C assert, so no unwinding
# ever crosses the C boundary.
panic = "abort"
